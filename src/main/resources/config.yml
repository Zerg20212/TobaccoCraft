growth:
  # Начальное время роста; каждый сорт далее настраивается в /tobacco editor.
  days-required: 10
  real-time-per-day-minutes: 20
  check-interval-minutes: 5
  # Модели ItemDisplay: LARGE_FERN, CustomModelData 1100–1103.
  show-stage-display: true

minigame:
  green-slots-count: 2
  slots-total: 6
  red-move-interval-ticks: 3
  timeout-seconds: 3
  cooldown-seconds: 5
  # Начальные награды: семена 100%, листья 50%. Шансы каждого сорта меняются в GUI.
  reward:
    seeds-min: 1
    seeds-max: 3
    leaf-min: 2
    leaf-max: 4

smoking:
  effects-duration-seconds: 240
  smoke-duration-seconds: 300
  overdose-threshold: 3
  overdose-damage: 12.0

